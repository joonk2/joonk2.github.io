name: Deploy blog-chatbot Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/blog-chatbot/**"
      - "assets/data/qa-dataset.json"
      - "scripts/manage_qa_dataset.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blog-chatbot
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate qa-dataset.json
        run: python scripts/manage_qa_dataset.py validate

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Worker dependencies
        working-directory: worker/blog-chatbot
        run: npm install

      - name: Check GitHub Secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          if [ -z "$CF_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret이 비어 있습니다."; missing=1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID secret이 비어 있습니다."; missing=1; fi
          if [ -z "$GEMINI_KEY" ]; then echo "::error::GEMINI_API_KEY secret이 비어 있습니다."; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "Repository → Settings → Secrets and variables → Actions 에서 3개 secret을 등록한 뒤 Re-run 하세요."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/blog-chatbot
          wranglerVersion: "3.99.0"
          secrets: |
            GEMINI_API_KEY

      - name: Verify deployment (/health)
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -fsS "https://blog-chatbot.with-joonk.workers.dev/health") && break
            echo "retry $i..."
            sleep 3
          done
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"hasApiKey":true'
          echo "$body" | grep -q '"model":"gemini-2.5-flash"'
