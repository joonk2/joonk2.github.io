name = "blog-chatbot"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Gemini API는 Worker egress 지역(HKG 등)에 따라 차단될 수 있음 → US 리전 고정
[placement]
region = "gcp:us-central1"



# Workers Logs (Cloudflare 대시보드 Observability). 공식 최소 설정만 사용.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
QA_DATASET_URL = "https://joonk2.github.io/assets/data/qa-dataset.json"
QA_DATASET_CACHE_TTL_SEC = "300"
GEMINI_MODEL = "gemini-3.6-flash"
GEMINI_API_VERSION = "v1beta"
GEMINI_TEMPERATURE = "0.75"
GEMINI_MAX_OUTPUT_TOKENS = "2048"

# 페르소나 (원하는 대로 수정)
BOT_NAME = "채팅봇"
BOT_OWNER = ""
SITE_TITLE = ""
SITE_URL = "https://joonk2.github.io"
BOT_TONE = "친근하고 자연스러운 존댓말. 간결하지만 따뜻하게, 이모지는 가끔만 사용한다."
BOT_PERSONALITY = "도움이 되고 싶어 하는 범용 AI 어시스턴트"
BOT_EXPERTISE = "일상 대화, 질문 답변, 글쓰기·아이디어, 학습·업무·창작·코딩 등 다양한 주제"

# wrangler secret put GEMINI_API_KEY
