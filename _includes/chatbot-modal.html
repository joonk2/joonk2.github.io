<div id="bisa-chatbot-root" class="bisa-chatbot-root" aria-hidden="true" data-bot-avatar="{{ '/assets/img/chatbot-robot.png' | relative_url }}">
  <button type="button" class="bisa-chatbot-backdrop" aria-label="챗봇 닫기" data-chatbot-close></button>
  <div class="bisa-chatbot-panel" role="dialog" aria-modal="true" aria-labelledby="cb-chat-title">
    <div id="cb-view-chat" class="view-content active">
      <header class="dm-header">
        <button class="header-btn" type="button" aria-label="닫기" data-chatbot-close><i class="fas fa-chevron-down"></i></button>
        <div class="header-profile">
          <div class="chat-header-avatar-wrap">
            <img class="chat-header-avatar" src="{{ '/assets/img/chatbot-robot.png' | relative_url }}" alt="채팅봇">
          </div>
          <div class="header-profile-text">
            <span class="header-username" id="cb-chat-title">채팅봇</span>
            <span class="chat-header-status">Active now</span>
          </div>
        </div>
        <div class="header-actions">
          <button type="button" class="header-icon-btn" id="cb-open-persona" aria-label="내 정보 설정">
            <i class="fas fa-user-cog"></i>
          </button>
        </div>
      </header>
      <div id="cb-chat-area"></div>
      <div class="input-area">
        <div class="dm-composer">
          <button class="composer-icon" type="button" aria-label="이모티콘" tabindex="-1"><i class="far fa-smile"></i></button>
          <div class="composer-field">
            <textarea id="cb-user-input" rows="1" placeholder="Message..." aria-label="메시지 입력"></textarea>
          </div>
          <button id="cb-send-btn" type="button" aria-label="보내기">Send</button>
          <button class="composer-mic" id="cb-mic-btn" type="button" aria-label="음성" tabindex="-1"><i class="fas fa-microphone"></i></button>
        </div>
      </div>
    </div>
    <div id="cb-view-persona" class="view-content">
      <header class="persona-header">
        <button type="button" class="header-btn" id="cb-persona-back" aria-label="채팅으로 돌아가기">
          <i class="fas fa-arrow-left"></i>
        </button>
        <h2 class="persona-title">내 정보</h2>
      </header>
      <div class="persona-body">
        <p class="persona-lead">나에 대해 알려주시면, 챗봇이 더 맞춤형으로 답변해 드립니다.</p>

        <label class="persona-field">
          <span class="persona-label">닉네임</span>
          <input type="text" id="cb-persona-nickname" maxlength="40" placeholder="챗봇이 어떻게 불러드리면 좋을까요?" autocomplete="nickname">
        </label>

        <label class="persona-field">
          <span class="persona-label">직업</span>
          <input type="text" id="cb-persona-occupation" maxlength="80" placeholder="예) 컴퓨터공학과 학생, 백엔드 개발자" autocomplete="organization-title">
        </label>

        <label class="persona-field">
          <span class="persona-label">내 추가 정보</span>
          <textarea id="cb-persona-extra" rows="4" maxlength="500" placeholder="기억해 두어야 할 관심사, 학습 수준, 선호하는 설명 방식 등"></textarea>
        </label>

        <div class="persona-memory">
          <div class="persona-memory-text">
            <span class="persona-label">메모리 사용</span>
            <p class="persona-memory-desc">저장한 정보를 바탕으로 대화를 개인화합니다. 끄면 맞춤 설정이 적용되지 않습니다.</p>
          </div>
          <label class="persona-toggle" aria-label="메모리 사용">
            <input type="checkbox" id="cb-persona-memory" checked>
            <span class="persona-toggle-track"></span>
          </label>
        </div>

        <button type="button" class="persona-save-btn" id="cb-persona-save">저장</button>
        <p class="persona-status" id="cb-persona-status" role="status" aria-live="polite"></p>
      </div>
    </div>
    <div id="cb-view-music" class="view-content">
      <div class="music-header">플레이리스트</div>
      <div class="playlist-header">
        <div class="chat-header-avatar-wrap">
          <img class="playlist-avatar" src="{{ '/assets/img/chatbot-robot.png' | relative_url }}" alt="채팅봇">
        </div>
        <h3>My Playlist 🎵</h3>
      </div>
      <div class="playlist-list" id="cb-playlist-items"></div>
    </div>
    <div class="mini-player">
      <img src="{{ '/assets/img/chatbot-robot.png' | relative_url }}" class="mini-album-art" id="cb-m-art" alt="">
      <div class="mini-info"><h4 id="cb-m-title">곡 로딩 중...</h4></div>
      <div class="mini-controls">
        <i class="fas fa-step-backward" data-music="prev" role="button" tabindex="0" aria-label="이전 곡"></i>
        <i class="fas fa-play" id="cb-m-play-icon" data-music="toggle" role="button" tabindex="0" aria-label="재생"></i>
        <i class="fas fa-step-forward" data-music="next" role="button" tabindex="0" aria-label="다음 곡"></i>
      </div>
    </div>
    <nav class="bottom-nav" aria-label="챗봇 메뉴">
      <button class="nav-btn active" id="cb-tab-chat" type="button" data-view="chat">
        <i class="fab fa-instagram"></i>
        <span>메시지</span>
      </button>
      <button class="nav-btn" id="cb-tab-persona" type="button" data-view="persona">
        <i class="fas fa-user-cog"></i>
        <span>내 정보</span>
      </button>
      <button class="nav-btn" id="cb-tab-music" type="button" data-view="music">
        <i class="fas fa-compact-disc"></i>
        <span>음악</span>
      </button>
    </nav>
  </div>
</div>

<div class="chatbot-launcher" id="chatbot-launcher">
  <div class="chatbot-dream-bubble" aria-hidden="true">
    <span class="chatbot-zzz">Z</span>
    <span class="chatbot-zzz">z</span>
    <span class="chatbot-zzz">z</span>
  </div>
  <div class="chatbot-speech" id="chatbot-speech" role="status">
    <span>반갑습니다 무엇을 도와드릴까요?</span>
  </div>
  <button type="button" id="chatbot-fab" aria-label="AI 챗봇 열기" aria-expanded="false">
    <span class="chatbot-robot-shell">
      <img
        class="chatbot-robot-img"
        src="{{ '/assets/img/chatbot-robot.png' | relative_url }}"
        alt=""
      >
      <span class="chatbot-sleep-mask" aria-hidden="true">
        <span class="chatbot-sleep-eye"></span>
        <span class="chatbot-sleep-eye"></span>
      </span>
    </span>
  </button>
</div>
